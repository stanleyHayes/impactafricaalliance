sonar.projectKey=impact-africa-alliance
sonar.projectName=Impact Africa Alliance
sonar.organization=impact-africa-alliance

# Sources & tests
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.ts,**/vite.config.ts,docs/**

# Coverage (LCOV produced by Vitest per workspace)
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/marketing/coverage/lcov.info,apps/admin/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/main.tsx,**/server.ts,**/seed.ts,**/*.routes.ts

sonar.sourceEncoding=UTF-8
