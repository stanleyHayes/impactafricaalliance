<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B3D2E" />
    <title>IAA Admin Console</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://localhost:4000 https:; font-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://* data:; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self';"
    />
    <script>
      (function () {
        const key = 'iaa.admin.theme';
        const stored = localStorage.getItem(key);
        const mode = stored === 'dark' || stored === 'light' ? stored : 'light';
        document.documentElement.dataset.theme = mode;
        if (mode === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <!--
      The brand faces, served from this origin.

      They used to come from Google, which meant a stylesheet fetch and then a
      font fetch from a second host before Outfit could paint. With font-display
      swap the page rendered in the fallback face and visibly changed once the
      font landed — every time the cache was cold. Same-origin and preloaded,
      the swap window is short enough not to be seen.

      Both are variable fonts covering 400-900, so every weight the designs use
      exists in one file per subset.
    -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/fraunces-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/fraunces-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/outfit-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/outfit-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
