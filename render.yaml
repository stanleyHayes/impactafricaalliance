# Render Blueprint — deploys the IAA API as a free web service.
# Docs: https://render.com/docs/blueprint-spec
# Every variable the API reads is declared below (apps/api/src/config/env.ts,
# plus LOG_LEVEL, read by the logger), except JWT_SECRET, a local-only fallback.
# `sync: false` marks a secret you fill in yourself in the Render dashboard
# (Environment); `value:` is a safe default.
# Marked REQUIRED: the API refuses to start in production without it.
# `--include=dev` is required: the build runs tsc and needs @types/* devDependencies.
services:
  - type: web
    name: iaa-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w @iaa/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      # ── Runtime ───────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: '1'
      # fatal, error, warn, info, debug or trace.
      - key: LOG_LEVEL
        value: info

      # ── Public URLs ───────────────────────────────────────────────────
      # Paystack sends donors back here after checkout, so the API refuses to
      # start unless it is the site's public https address and nothing more
      # (no path).
      - key: PUBLIC_SITE_URL
        value: https://impactafricaalliance.org
      - key: ADMIN_URL
        value: https://admin.impactafricaalliance.org
      - key: CORS_ORIGINS
        value: https://impactafricaalliance.org,https://www.impactafricaalliance.org,https://admin.impactafricaalliance.org,https://impactafricaalliance-admin.vercel.app,https://impactafricaalliance.vercel.app

      # ── Database & JWT ────────────────────────────────────────────────
      # REQUIRED. The MongoDB Atlas connection string (mongodb+srv://…).
      - key: MONGODB_URI
        sync: false
      # Render generates these two; they must differ. (JWT_SECRET, the old
      # single-secret fallback, is for local use only and left out on purpose.)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: '900'
      - key: JWT_REFRESH_TTL
        value: '2592000'

      # ── Shared secrets ────────────────────────────────────────────────
      # Shared with the marketing site's /api/collect proxy. Set the same value
      # in the Vercel project, or visits are counted without a country.
      - key: ANALYTICS_INGEST_SECRET
        generateValue: true
      # Lets the scheduled GitHub Action run the due automation (review
      # invitations, event reminders, thank-yous, and the hourly check that
      # confirms Paystack gifts). The free plan sleeps, and a sleeping process
      # runs no timers, so something awake has to knock.
      # Set the SAME value here and as the AUTOMATION_RUN_SECRET repository
      # secret in GitHub, or the run is refused: no email goes out, and a
      # Paystack gift whose donor never came back stays pending.
      - key: AUTOMATION_RUN_SECRET
        sync: false

      # ── Seed accounts ─────────────────────────────────────────────────
      - key: SEED_ADMIN_EMAIL
        value: admin@impactafricaalliance.org
      - key: SEED_ADMIN_NAME
        value: IAA Administrator
      # REQUIRED, at least 10 characters: the first admin's password for `npm run seed`.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Optional. Left empty, the seed generates one and prints it.
      - key: SEED_EDITOR_PASSWORD
        sync: false

      # ── Email (Resend) ────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Impact Africa Alliance <no-reply@impactafricaalliance.org>
      - key: EMAIL_NOTIFY_TO
        value: info@impactafricaalliance.org
      # Not read by the API today; kept as the data-protection contact on record.
      - key: DPO_EMAIL
        value: info@impactafricaalliance.org

      # ── Cloudinary (media) ────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: iaa

      # ── Payments: Paystack (Ghana cedis) ──────────────────────────────
      # The Paystack account and its keys are shared with the owner's other
      # apps. Leave the Paystack dashboard's Callback URL and Webhook URL as
      # they are: they belong to those apps. Every payment carries its own
      # return and cancel addresses, built from PUBLIC_SITE_URL, and payments
      # are confirmed when donors come back and by the hourly automation run,
      # so this site needs no webhook.
      # No public key is needed: the site sends donors to Paystack's hosted
      # checkout, and only this API talks to Paystack, with the secret key.
      # Checklist: docs/deploy/donations.md
      # Paystack Dashboard → Settings → API Keys & Webhooks.
      # sk_test_… while testing, sk_live_… when live.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # What Paystack charges in: GHS, Ghana cedis. (USD also works, from
      # $2 a gift, if Paystack has enabled dollars on the account.)
      - key: PAYSTACK_CURRENCY
        value: GHS
      # Leave as it is: the secret key is sent here, so production refuses
      # anything else. Only a local test points this at a stand-in.
      - key: PAYSTACK_API_URL
        value: https://api.paystack.co

      # ── Payments: Stripe (US dollars) ─────────────────────────────────
      # Stripe Dashboard → Developers → API keys (sk_test_… / sk_live_…).
      - key: STRIPE_SECRET_KEY
        sync: false
      # The signing secret (whsec_…) of the webhook endpoint
      #   https://iaa-api.onrender.com/api/payments/webhooks/stripe
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ── AI ────────────────────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── MFA ───────────────────────────────────────────────────────────
      # REQUIRED. 32-byte base64 key:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MFA_REQUIRED_FOR_ROLES
        value: admin

      # ── Social OAuth ──────────────────────────────────────────────────
      # 32-byte base64 key for stored account tokens. Left empty, the API uses
      # MFA_ENCRYPTION_KEY instead; a key of its own can be rotated separately.
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        sync: false
      # Public base URL of this API service — confirm the actual onrender.com URL.
      - key: SOCIAL_OAUTH_REDIRECT_BASE
        value: https://iaa-api.onrender.com
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false

      # Threads. A separate app and connection from Facebook/Instagram even
      # though Meta owns it, so it gets its own credentials.
      # Redirect URI: <SOCIAL_OAUTH_REDIRECT_BASE>/api/social/threads/callback
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false

      # WhatsApp Business — opted-in subscriber messaging only. This is NOT
      # WhatsApp Channel publishing, which has no official API.
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      # A broadcast is always outside the 24-hour service window, so it can
      # only be sent as a template Meta has already approved. Free text is
      # rejected. Create the template first and put its name here.
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en

      # Google / YouTube. Enable YouTube Data API v3 on the Cloud project.
      # Redirect URI: <SOCIAL_OAUTH_REDIRECT_BASE>/api/social/youtube/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # TikTok. Content posting needs product access granted on the app first;
      # until then the destination stays switched off.
      # Redirect URI: <SOCIAL_OAUTH_REDIRECT_BASE>/api/social/tiktok/callback
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false

      # Comma-separated allow-list of destinations the dashboard may publish
      # to. Leave unset to enable every destination whose credentials exist.
      # e.g. facebook,instagram,linkedin,x
      - key: SOCIAL_ENABLED_DESTINATIONS
        sync: false

      # Set to "true" to make an editor's social posts wait for an
      # administrator before they are queued. Off by default: a small team
      # does not need a second pair of eyes on every post. Administrators
      # publish directly either way — self-approval is not a review.
      - key: SOCIAL_REQUIRE_APPROVAL
        value: 'false'

      # ── Data retention (days; 0 turns the purge off) ──────────────────
      - key: SUBMISSION_RETENTION_DAYS
        value: '1095'
      - key: UNSUBSCRIBED_RETENTION_DAYS
        value: '90'
      - key: FAILED_DONATION_RETENTION_DAYS
        value: '30'
